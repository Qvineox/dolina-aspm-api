edition = "2023";

package dolina.filestore.v1;

option go_package = "gitlab.domsnail.ru/dolina/dolina-aspm-api/api/gen/go/filestore/v1;filestore_v1";
option features.(pb.go).api_level = API_OPAQUE;

import "google/protobuf/go_features.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "filestore/v1/file.proto";
import "common/v1/uuid.proto";

service FilestoreService {
  rpc GetFileMetadataByUUID(common.v1.UUID) returns (FileMetadata) {
    option (google.api.http) = {
      get: "/api/v1/filestore/{uuid}/metadata"
    };
  }

  rpc GetFileByUUID(common.v1.UUID) returns (FileChunk) {
    option (google.api.http) = {
      get: "/api/v1/filestore/{uuid}"
    };
  }

  rpc DeleteFileByUUID(common.v1.UUID) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/filestore/{uuid}"
    };
  }

  rpc GetFileStreamByUUID(common.v1.UUID) returns (stream FileChunk);
}