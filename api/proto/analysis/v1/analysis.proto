edition = "2023";

package dolina.analysis.v1;

option go_package = "gitlab.domsnail.ru/dolina/dolina-aspm-api/api/gen/go/analysis/v1;analysis_v1";
option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/go_features.proto";
import "google/protobuf/duration.proto";

import "analysis/v1/scanners.proto";
import "workers/v1/worker.proto";

message AnalyzeOptions {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Analyze options"
      description: "Contextual metadata accompanying a raw scanner report. It provides information "
          "about the environment in which the scan was executed, such as the repository URL, "
          "Git reference (branch, tag, commit), pipeline or build ID, and any other relevant "
          "deployment or runtime context. This data is used by Dolina ASPM to enrich, filter, "
          "and correlate findings with specific code versions or build stages."
    }
  };

  repeated ScannerReport scanner_report_list = 1;

  // application/asset related fields
  string application_suid = 2;
  string asset_suid = 3;
  string project_suid = 4;

  // create or update project repository by provided attributes
  string repository_path = 5; // used to generate repository suid and name
  string repository_url = 6;
  string repository_ref = 7; // branch, tag, any variation of an app

  // create or update project artifact by provided attributes
  string artifact_purl = 8;

  // ci/cd attributes
  string pipeline_id = 9;

  // defines if non-existing entities (assets, repositories, artifacts or project) will be created
  bool auto_create = 10;

  // if early_start set to true, workers start to process scanner reports immediately, not waiting for process window to close
  google.protobuf.Duration upload_window_duration = 11; // defines how long to delay processing
  bool early_start = 12;
}

message Analysis {
  string uuid = 1;

  string repository_uuid = 2;
  string repository_url = 3;
  string repository_ref = 4;
  string repository_path = 5;

  string artifact_uuid = 6;
  string artifact_purl = 7;

  string pipeline_id = 8;

  ScannerReport scanner_report = 9;

  workers.v1.WorkerIdentity worker_identity = 10 [features.field_presence = EXPLICIT];
  string job_uuid = 11;

  string report_uuid = 12;
}

enum AnalysisState {
  ANALYSIS_STATE_UNSPECIFIED = 0;

  ANALYSIS_STATE_NOT_STARTED = 1; // analysis job in a queue
  ANALYSIS_STATE_ASSIGNED = 2; // worker is assigned
  ANALYSIS_STATE_IN_PROGRESS = 3; // worker is processing
  ANALYSIS_STATE_VERIFICATION = 4; // worker is verifying and sends analysis results
  ANALYSIS_STATE_DONE = 5; // analysis is done and results are saved

  ANALYSIS_STATE_ERROR = 6; // analysis is finished with error
  ANALYSIS_STATE_TIMEOUT = 7; // analysis is finished with timeout
  ANALYSIS_STATE_CANCELED = 8; // analysis is cancel by user
}