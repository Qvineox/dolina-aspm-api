edition = "2023";

package dolina.application.v1;

option go_package = "gitlab.domsnail.ru/dolina/dolina-aspm-api/api/gen/go/applications/v1;application_v1";
option features.(pb.go).api_level = API_OPAQUE;
option features.field_presence = IMPLICIT;

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/go_features.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "applications/v1/application.proto";
import "common/v1/pagination.proto";
import "common/v1/sort.proto";
import "common/v1/uuid.proto";

service ApplicationsService {
  rpc GetApplicationByID(common.v1.ID) returns (Application) {
    option (google.api.http) = {
      get: "/api/v1/applications/{id}"
    };
  }

  rpc GetProjectApplications(common.v1.ID) returns (Application) {
    option (google.api.http) = {
      get: "/api/v1/projects/{id}/applications"
    };
  }

  rpc GetApplicationsByQueryFilter(ApplicationsQueryFilter) returns (ApplicationsQueryResponse) {
    option (google.api.http) = {
      get: "/api/v1/applications"
    };
  }

  rpc CreateApplication(Application) returns (common.v1.ID) {
    option (google.api.http) = {
      put: "/api/v1/application"
    };
  }

  rpc UpdateApplication(Application) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/v1/applications/{id}"
      body: "*"
    };
  }

  rpc DeleteApplicationByID(common.v1.ID) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/applications/{id}"
    };
  }

  rpc TransferApplicationProjects(ApplicationProjectsTransferRequest) returns (google.protobuf.Empty) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Transfers application with all its relations to other project (or multiple projects, also can be removed "
          "from any projects if project_is if left unset"
    };
    option (google.api.http) = {
      patch: "/api/v1/applications/{application_id}/transfer"
      body: "*"
    };
  }
}

message ApplicationsQueryFilter {
  string name = 1;

  repeated string label_list = 2;
  uint32 risk_profile_id = 3;
  repeated uint32 project_id_list = 4;

  common.v1.Pagination pagination = 5;
  common.v1.Sort sort = 6;
}

message ApplicationsQueryResponse {
  repeated Application applications_list = 1;

  common.v1.PaginationMetadata pagination = 2;
}

message ApplicationProjectsTransferRequest {
  uint32 application_id = 1;
  repeated uint32 project_id_list = 2;
}